[loggers]
keys=root,main_app

[handlers]
keys=fileHandler,consoleHandler

[formatters]
keys=simpleFormatter

[logger_root]
level=INFO
handlers=fileHandler,consoleHandler

[logger_main_app]
level=INFO
handlers=fileHandler,consoleHandler
qualname=AutoJingJia
propagate=0

[handler_fileHandler]
class=FileHandler
level=INFO
formatter=simpleFormatter
args=('/default.log', 'a', 'utf-8')

[handler_consoleHandler]
class=StreamHandler
level=INFO
formatter=simpleFormatter
args=(sys.stdout,)

[handler_timeHandler]
class=TimeRotatingFileHandler
level=INFO
formatter=simpleFormatter
args=('/time.log', 'midnight', 1, 0, 'utf-8')

[formatter_simpleFormatter]
format=%(asctime)s - %(name)s - %(levelname)s - %(message)s
